name: Run Jest Tests
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    strategy:
      matrix:
        node-version: [20.x]
 
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
 
      - name: Cài đặt Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
 
      - name: Cài đặt dependencies
        run: npm install
 
      - name: Chạy Jest tests
        run: npm test
